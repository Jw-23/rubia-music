name: Build Android app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    name: Android APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: rubia-music-app/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: android

      - name: Install Android NDK
        shell: bash
        run: |
          NDK_VERSION=27.2.12479018
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        working-directory: rubia-music-app
        run: npm ci

      - name: Verify release version
        id: app-version
        shell: bash
        working-directory: rubia-music-app
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match application version v$version" >&2
            exit 1
          fi

      - name: Initialize Android project
        working-directory: rubia-music-app
        run: npm run tauri android init -- --ci

      - name: Build and publish Android release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NDK_HOME: ${{ env.NDK_HOME }}
        with:
          projectPath: rubia-music-app
          mobile: android
          tagName: ${{ github.ref_name }}
          releaseName: Rubia Music ${{ github.ref_name }}
          releaseBody: Download the installer for your operating system from the assets below.
          releaseDraft: false
          prerelease: false
          args: --apk --aab --target aarch64 --target armv7 --target x86_64 --ci

      - name: Build Android workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: rubia-music-app
        run: npm run tauri android build -- --apk --aab --target aarch64 --target armv7 --target x86_64 --ci

      - name: Upload Android workflow artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: rubia-music-v${{ steps.app-version.outputs.version }}-android
          path: |
            rubia-music-app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            rubia-music-app/src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
