name: Retry v0.1.2 Android build

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/retry-v0.1.2.yml"

permissions:
  actions: write
  contents: write

jobs:
  retry:
    name: Move tag and dispatch Android build
    if: github.repository == 'Jw-23/rubia-music'
    runs-on: ubuntu-latest

    steps:
      - name: Move v0.1.2 tag to the fix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/v0.1.2" \
            -f sha="$GITHUB_SHA" \
            -F force=false

      - name: Trigger fixed Android build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build-android.yml --repo "$GITHUB_REPOSITORY" --ref v0.1.2
