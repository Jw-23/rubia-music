name: Build desktop installers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            artifact: macos-arm64
            rust_target: aarch64-apple-darwin
            signing_identity: "-"
            args: --target aarch64-apple-darwin --bundles dmg
            bundle_path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: macOS Intel
            platform: macos-latest
            artifact: macos-x64
            rust_target: x86_64-apple-darwin
            signing_identity: "-"
            args: --target x86_64-apple-darwin --bundles dmg
            bundle_path: target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows x64
            platform: windows-latest
            artifact: windows-x64
            rust_target: x86_64-pc-windows-msvc
            signing_identity: ""
            args: --target x86_64-pc-windows-msvc --bundles nsis,msi
            bundle_path: |
              target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
              target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: rubia-music-app/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: ${{ matrix.artifact }}

      - name: Install frontend dependencies
        working-directory: rubia-music-app
        run: npm ci

      - name: Verify release version
        id: app-version
        shell: bash
        working-directory: rubia-music-app
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match application version v$version" >&2
            exit 1
          fi

      - name: Build installers
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: rubia-music-app
        env:
          APPLE_SIGNING_IDENTITY: ${{ matrix.signing_identity }}
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Build and publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.signing_identity }}
        with:
          projectPath: rubia-music-app
          tagName: ${{ github.ref_name }}
          releaseName: Rubia Music ${{ github.ref_name }}
          releaseBody: Download the installer for your operating system from the assets below.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: rubia-music-v${{ steps.app-version.outputs.version }}-${{ matrix.artifact }}
          path: ${{ matrix.bundle_path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
