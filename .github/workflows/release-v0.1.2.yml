name: Create v0.1.2 tag

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/release-v0.1.2.yml"

permissions:
  actions: write
  contents: write

jobs:
  release:
    name: Tag and dispatch release builds
    if: github.repository == 'Jw-23/rubia-music'
    runs-on: ubuntu-latest

    steps:
      - name: Create v0.1.2 tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/v0.1.2" \
            -f sha="$GITHUB_SHA"

      - name: Trigger Android build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build-android.yml --repo "$GITHUB_REPOSITORY" --ref v0.1.2

      - name: Trigger desktop builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build-desktop.yml --repo "$GITHUB_REPOSITORY" --ref v0.1.2
